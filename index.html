<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tot Board">
<meta name="theme-color" content="#CDE9F7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tot Board — Numbers, Letters, Colors, Shapes</title>
<style>
  :root{
    --sky:#CDE9F7;
    --panel:#FFFFFF;
    --ink:#23364A;
    --ink-soft:#5F7288;
    --line:#BBD7E8;
    --barn:#C9483A;
    --grass:#3FA65C;
    --sun:#F2BE3C;
    --plum:#8353C5;
    --radius:26px;
    --display:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--sky);color:var(--ink);
    font-family:var(--display);
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:14px;}
  .hidden{display:none !important;}

  /* ---------- home ---------- */
  #home{
    height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .home-inner{
    min-height:100%;max-width:1000px;margin:0 auto;padding:20px;
    display:flex;flex-direction:column;justify-content:center;gap:20px;
  }
  @media (max-height:760px){
    .home-inner{gap:12px;padding:14px;}
    .tile-grid{gap:12px;}
    .tile{min-height:110px;padding:14px 10px;gap:6px;}
  }
  .home-title{
    text-align:center;font-weight:800;font-size:clamp(30px,5vw,46px);
    letter-spacing:-0.02em;margin:0;
  }
  .home-sub{text-align:center;color:var(--ink-soft);font-weight:600;font-size:17px;margin:-8px 0 6px;}
  .tile-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;
  }
  .tile{
    border-radius:var(--radius);padding:26px 20px;min-height:170px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:#fff;font-weight:800;font-size:clamp(22px,3.4vw,32px);letter-spacing:-0.01em;
    border:4px solid rgba(0,0,0,.10);
    transition:transform .08s ease;
  }
  .tile:active{transform:scale(.96);}
  .tile .glyphs{font-size:clamp(34px,6vw,54px);line-height:1;font-weight:800;}
  #tile-numbers{background:var(--sun);color:#5B4308;}
  #tile-letters{background:var(--barn);}
  #tile-colors{background:var(--plum);}
  #tile-shapes{background:var(--grass);}
  #tile-animals{background:#2AA7A0;}
  #tile-catherine{background:#E85D8A;}
  #tile-memory{background:#5B6ABF;}
  #tile-anthems{background:#3E7CB1;}
  .tile .glyphs .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin:0 2px;vertical-align:middle;}

  /* ---------- module screen ---------- */
  #module{height:100%;display:flex;flex-direction:column;padding:14px 16px;gap:12px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .home-btn{
    width:56px;height:56px;border-radius:18px;background:var(--panel);
    border:3px solid var(--line);font-size:26px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .module-name{font-weight:800;font-size:22px;letter-spacing:-0.01em;flex:1;text-align:center;}
  .mode-toggle{
    display:flex;background:var(--panel);border:3px solid var(--line);
    border-radius:18px;padding:4px;gap:4px;flex:0 0 auto;
  }
  .mode-toggle button{
    font-weight:800;font-size:17px;padding:10px 18px;border-radius:13px;color:var(--ink-soft);
  }
  .mode-toggle button.on{background:var(--ink);color:#fff;}

  /* ---------- card ---------- */
  #card{
    flex:1;min-height:0;border-radius:var(--radius);
    background:var(--panel);border:4px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2vh;padding:2vh 3vw;text-align:center;overflow:hidden;position:relative;
  }
  #card.pop{animation:pop .32s ease-out;}
  @keyframes pop{
    0%{transform:scale(.86);opacity:.4;}
    70%{transform:scale(1.03);}
    100%{transform:scale(1);opacity:1;}
  }
  @media (prefers-reduced-motion:reduce){
    #card.pop{animation:none;}
    .tile,.btn-big{transition:none;}
  }

  .big-number{font-size:min(36vh,30vw);font-weight:800;line-height:.95;letter-spacing:-0.03em;}
  .animal-rows{display:flex;flex-direction:column;gap:1.2vh;align-items:center;}
  .animal-row{display:flex;gap:1.4vw;font-size:min(9vh,8vw);line-height:1;}
  .none-word{color:var(--ink-soft);font-weight:700;font-size:min(6vh,5vw);}

  .count-title{font-weight:800;font-size:min(7vh,6vw);letter-spacing:-0.01em;}
  .count-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6vh;max-width:92%;}
  .count-cell{
    width:min(12vh,13vw);height:min(12vh,13vw);
    display:flex;align-items:center;justify-content:center;
    border-radius:24%;background:var(--sky);border:4px solid var(--line);
    font-weight:800;font-size:min(6.5vh,7vw);
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .count-cell.lit{background:#FBEBC2;border-color:#E4B94F;}
  .count-cell.now{transform:scale(1.16);background:var(--barn);border-color:var(--barn);color:#fff;}
  .count-cell.cell-sm{width:min(9vh,10vw);height:min(9vh,10vw);font-size:min(5vh,5.5vw);border-radius:26%;}
  .count-cell.cell-color.now{transform:scale(1.16);box-shadow:0 0 0 6px var(--ink);}
  .count-cell.cell-shape svg{width:72%;height:72%;}
  @media (prefers-reduced-motion:reduce){
    .count-cell{transition:none;}
    .count-cell.now{transform:none;}
  }

  .animal-big{font-size:min(36vh,30vw);line-height:1;}

  /* ---------- name module ---------- */
  .name-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4vh;}
  .name-tile{
    width:min(13vh,9.5vw);height:min(15vh,11.5vw);
    display:flex;align-items:center;justify-content:center;
    border-radius:20%;background:var(--sky);border:4px solid var(--line);
    font-weight:800;font-size:min(9vh,7vw);
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .name-tile.lit{background:#FBEBC2;border-color:#E4B94F;}
  .name-tile.now{transform:scale(1.14);background:var(--barn);border-color:var(--barn);color:#fff;}
  .name-word{font-weight:800;font-size:min(9vh,8vw);letter-spacing:-0.01em;}

  /* ---------- memory game ---------- */
  .memory-hud{
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border:3px solid var(--line);border-radius:18px;padding:6px 8px;flex:0 0 auto;
  }
  .pair-picker{display:flex;gap:4px;background:var(--sky);border-radius:13px;padding:4px;}
  .pair-picker button{
    width:38px;height:38px;border-radius:10px;font-weight:800;font-size:18px;color:var(--ink-soft);
  }
  .pair-picker button.on{background:var(--ink);color:#fff;}
  #memTimer{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;}
  #memRestart{font-size:24px;font-weight:800;width:44px;height:44px;border-radius:13px;background:var(--sky);}
  .mem-grid{
    display:grid;gap:1.8vh;
  }
  .mem-grid.p3{grid-template-columns:repeat(3,1fr);width:min(92%,100vh);}
  .mem-grid.p6{grid-template-columns:repeat(4,1fr);width:min(92%,88vh);}
  .mem-grid.p9{grid-template-columns:repeat(6,1fr);width:min(96%,132vh);}
  .mem-grid.p6 .mem-card{font-size:min(9.5vh,8vw);border-radius:18px;}
  .mem-grid.p9 .mem-card{font-size:min(7vh,6vw);border-radius:14px;border-width:3px;}
  .mem-card{
    aspect-ratio:1;border-radius:22px;border:4px solid rgba(0,0,0,.12);
    background:var(--barn);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:min(13vh,11vw);line-height:1;
    transition:transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .mem-card:active{transform:scale(.96);}
  .mem-card .face{display:none;}
  .mem-card.up,.mem-card.matched{background:var(--panel);border-color:var(--line);}
  .mem-card.matched{background:#DDF2E5;border-color:#58BB7C;}
  .mem-card.up .face,.mem-card.matched .face{display:block;}
  .mem-card.up .back,.mem-card.matched .back{display:none;}
  #memWin{
    position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,255,255,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  }
  .win-title{font-weight:800;font-size:min(10vh,9vw);}
  .win-time{font-weight:800;font-size:min(6vh,5vw);color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  #memAgain{
    background:var(--grass);color:#fff;font-weight:800;font-size:min(4.5vh,4vw);
    padding:2vh 5vw;border-radius:22px;border:4px solid rgba(0,0,0,.12);
  }

  /* ---------- anthems ---------- */
  .flag-row{display:flex;gap:4vw;justify-content:center;flex-wrap:wrap;}
  .flag-btn{
    display:flex;flex-direction:column;align-items:center;gap:1.5vh;
    background:var(--sky);border:4px solid var(--line);border-radius:26px;
    padding:3vh 4vw;transition:transform .08s ease;
  }
  .flag-btn:active{transform:scale(.96);}
  .flag-emoji{font-size:min(26vh,22vw);line-height:1;}
  .flag-name{font-weight:800;font-size:min(6vh,5vw);}
  .anthem-title{font-weight:800;font-size:min(4.5vh,4.5vw);}
  .anthem-frame{
    flex:1;min-height:0;width:100%;max-width:min(96%,120vh);
    border-radius:18px;overflow:hidden;border:4px solid var(--line);background:#000;
  }
  .anthem-frame iframe{width:100%;height:100%;display:block;}
  .anthem-back{
    background:var(--panel);border:4px solid var(--line);border-radius:18px;
    font-weight:800;font-size:20px;padding:12px 26px;
  }

  .big-letters{font-size:min(34vh,26vw);font-weight:800;line-height:1;letter-spacing:.02em;}
  .sound-chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .sound-chip{
    background:var(--sky);border:3px solid var(--line);border-radius:999px;
    padding:8px 22px;font-weight:800;font-size:min(4vh,3.6vw);color:var(--ink);
    display:inline-flex;align-items:center;gap:10px;
  }
  .chip-emoji{font-size:1.3em;line-height:1;}
  .sound-chip.short{background:#FBEBC2;border-color:#E4B94F;color:#6B4E0A;}
  .sound-chip.long{background:#DDF2E5;border-color:#58BB7C;color:#1D5E36;}
  .sound-legend{display:flex;gap:16px;font-size:15px;font-weight:700;}
  .leg{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);}
  .leg::before{content:"";width:14px;height:14px;border-radius:50%;}
  .leg.short::before{background:#E4B94F;}
  .leg.long::before{background:#58BB7C;}

  .color-name{font-size:min(18vh,16vw);font-weight:800;line-height:1;letter-spacing:-0.02em;}
  .color-emoji{font-size:min(12vh,11vw);line-height:1;}

  .shape-svg{width:min(46vh,46vw);height:min(46vh,46vw);}
  .shape-name{font-size:min(11vh,10vw);font-weight:800;line-height:1;letter-spacing:-0.02em;}

  /* ---------- quiz bar ---------- */
  #quizbar{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .btn-big{
    flex:1;height:84px;border-radius:22px;font-size:40px;font-weight:800;
    background:var(--panel);border:4px solid var(--line);
    transition:transform .06s ease;
  }
  .btn-big:active{transform:scale(.96);}
  #orderBtn{
    flex:0 0 auto;height:84px;border-radius:22px;padding:0 22px;
    background:var(--panel);border:4px solid var(--line);
    font-weight:800;font-size:18px;color:var(--ink-soft);
  }
  #teachbar{display:flex;justify-content:center;}
  .teach-hint{color:var(--ink-soft);font-weight:600;font-size:16px;padding:6px 0 2px;}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home">
  <div class="home-inner">
  <h1 class="home-title">Tot Board</h1>
  <p class="home-sub">Pick something to learn</p>
  <div class="tile-grid">
    <button class="tile" id="tile-numbers" data-module="numbers">
      <span class="glyphs">1 2 3</span><span>Numbers</span>
    </button>
    <button class="tile" id="tile-letters" data-module="letters">
      <span class="glyphs">A b C</span><span>Letters</span>
    </button>
    <button class="tile" id="tile-colors" data-module="colors">
      <span class="glyphs"><span class="dot" style="background:#E23B2E"></span><span class="dot" style="background:#F2BE3C"></span><span class="dot" style="background:#2F7FD1"></span></span><span>Colors</span>
    </button>
    <button class="tile" id="tile-shapes" data-module="shapes">
      <span class="glyphs">&#9679; &#9632; &#9650;</span><span>Shapes</span>
    </button>
    <button class="tile" id="tile-animals" data-module="animals">
      <span class="glyphs">&#x1F404; &#x1F437; &#x1F434;</span><span>Animals</span>
    </button>
    <button class="tile" id="tile-catherine" data-module="catherine">
      <span class="glyphs">C&#10084;&#65039;</span><span>Catherine</span>
    </button>
    <button class="tile" id="tile-memory" data-module="memory">
      <span class="glyphs">&#x2B50; &#x2B50;</span><span>Memory Match</span>
    </button>
    <button class="tile" id="tile-anthems" data-module="anthems">
      <span class="glyphs">&#x1F1E8;&#x1F1E6; &#x1F1FA;&#x1F1F8;</span><span>Anthems</span>
    </button>
  </div>
  </div>
</div>

<!-- ================= MODULE ================= -->
<div id="module" class="hidden">
  <div class="topbar">
    <button class="home-btn" id="homeBtn" aria-label="Back to home">&#8962;</button>
    <div class="module-name" id="moduleName"></div>
    <div class="mode-toggle" id="modeToggle">
      <button id="teachBtn" class="on">Teach</button>
      <button id="quizBtn">Quiz</button>
    </div>
    <div class="memory-hud hidden" id="memoryHud">
      <div class="pair-picker" id="pairPicker" aria-label="Number of pairs">
        <button data-pairs="3" class="on">3</button>
        <button data-pairs="6">6</button>
        <button data-pairs="9">9</button>
      </div>
      <span id="memTimer">0:00</span>
      <button id="memRestart" aria-label="New round">&#8635;</button>
    </div>
  </div>

  <div id="card"></div>

  <div id="teachbar"><div class="teach-hint">Playing on its own — tap the card to hear it again</div></div>

  <div id="quizbar" class="hidden">
    <button class="btn-big" id="prevBtn" aria-label="Previous">&#9664;</button>
    <button id="orderBtn">Mixed up</button>
    <button class="btn-big" id="nextBtn" aria-label="Next">&#9654;</button>
  </div>
</div>

<script>
/* =========================================================================
   CUSTOM AUDIO HOOK
   The app speaks with the device text-to-speech voice by default.
   To replace any line with your own recording (a real "Ms. Rachel" read):
     1. Record a clip and save it as audio/<key>.mp3 in the repo.
     2. Add the key to CUSTOM_AUDIO below.
   Keys: every item has two —
     "<id>"        the short answer, played when a card is tapped in Quiz
     "<id>-teach"  the full teaching line, played in Teach mode
   Ids: num-0 … num-10, letter-a … letter-z,
        color-red, color-orange, color-yellow, color-green, color-blue,
        color-purple, color-pink, color-brown, color-black, color-white,
        shape-circle, shape-square, shape-triangle, shape-rectangle,
        shape-star, shape-heart, shape-oval, shape-diamond
   Example: CUSTOM_AUDIO = new Set(["num-3-teach", "num-3"]);
   The service worker caches audio files after first load, so they work
   offline too.
   ========================================================================= */
const AUDIO_BASE = "audio/";
const CUSTOM_AUDIO = new Set([]);

/* ------------------------- content ------------------------- */
const ANIMALS = [
  {emoji:"\u{1F404}", word:"cows"},
  {emoji:"\u{1F986}", word:"duckies"}, /* "ducks" comes out as "dogs" in TTS */
  {emoji:"\u{1F437}", word:"pigs"},
  {emoji:"\u{1F414}", word:"chickens"},
  {emoji:"\u{1F434}", word:"horses"}
];
const NUMBER_WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];

const NUMBERS = [];
for (let n = 0; n <= 12; n++) {
  const a = n === 0 ? ANIMALS[1] : ANIMALS[(n - 1) % 5]; // rotates cow, duck, pig, chicken, horse
  NUMBERS.push({
    id: "num-" + n,
    n: n,
    animal: a,
    say: NUMBER_WORDS[n] + "!",
    teach: n === 0
      ? "Zero! Zero " + a.word + ". Zero means none!"
      : NUMBER_WORDS[n] + "! " + NUMBER_WORDS[n] + " " + (n === 1 ? a.word.slice(0, -1) : a.word) + "!"
  });
}

/* Letter sounds, spoken as "The B says buh." The spellings are what
   the device voice reads aloud, so they are phonetic, not dictionary
   words — tune any that sound off on your device (X is the fussiest).
   Vowels tagged short/long for the color-coded chips. */
const S = (s) => ({s, t:"short"});
const L = (s) => ({s, t:"long"});
const N = (s) => ({s, t:""});
const LETTER_SOUNDS = {
  A:[S("ah"),L("ay")], B:[N("buh")], C:[N("see"),N("kuh")], D:[N("duh")],
  E:[S("eh"),L("ee")], F:[N("fuh")], G:[N("guh"),N("juh")], H:[N("huh")],
  I:[S("ih"),L("eye")], J:[N("juh")], K:[N("kuh")], L:[N("luh")],
  M:[N("muh")], N:[N("nuh")], O:[S("ah"),L("oh")], P:[N("puh")],
  Q:[N("kwuh")], R:[N("ruh")], S:[N("sss")], T:[N("tuh")],
  U:[S("uh"),L("yoo")], V:[N("vuh")], W:[N("wuh")], X:[N("ks")],
  Y:[N("yuh")], Z:[N("zuh")]
};
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(Ltr => ({
  id: "letter-" + Ltr.toLowerCase(),
  upper: Ltr,
  lower: Ltr.toLowerCase(),
  sounds: LETTER_SOUNDS[Ltr],
  say: Ltr + "!",
  teach: Ltr + "! "
    + LETTER_SOUNDS[Ltr].map((x, i) => (i === 0 ? "The " : "the ") + Ltr + " says " + x.s).join(". And ") + "."
}));

const COLORS = [
  {id:"color-red",    name:"Red",    hex:"#E23B2E", ink:"#FFFFFF", emoji:"\u{1F34E}", like:"like a red apple"},
  {id:"color-orange", name:"Orange", hex:"#F5862B", ink:"#FFFFFF", emoji:"\u{1F955}", like:"like an orange carrot"},
  {id:"color-yellow", name:"Yellow", hex:"#F6C445", ink:"#5B4308", emoji:"\u2600\uFE0F", like:"like the yellow sun"},
  {id:"color-green",  name:"Green",  hex:"#3FA65C", ink:"#FFFFFF", emoji:"\u{1F438}", like:"like a green frog"},
  {id:"color-blue",   name:"Blue",   hex:"#2F7FD1", ink:"#FFFFFF", emoji:"\u{1F433}", like:"like a blue whale"},
  {id:"color-purple", name:"Purple", hex:"#8353C5", ink:"#FFFFFF", emoji:"\u{1F347}", like:"like purple grapes"},
  {id:"color-pink",   name:"Pink",   hex:"#F27BA6", ink:"#5E1F38", emoji:"\u{1F437}", like:"like a pink pig"},
  {id:"color-brown",  name:"Brown",  hex:"#8B5A34", ink:"#FFFFFF", emoji:"\u{1F43B}", like:"like a brown bear"},
  {id:"color-black",  name:"Black",  hex:"#26262B", ink:"#FFFFFF", emoji:"\u{1F408}\u200D\u2B1B", like:"like a black cat"},
  {id:"color-white",  name:"White",  hex:"#FFFFFF", ink:"#23364A", emoji:"\u26C4", like:"like white snow"}
].map(c => ({...c, say: c.name + "!", teach: c.name + "! " + c.name + ", " + c.like + "!"}));

const SHAPE_COLORS = {circle:"#E23B2E", square:"#2F7FD1", triangle:"#3FA65C", rectangle:"#F5862B",
                      star:"#F6C445", heart:"#E85D8A", oval:"#8353C5", diamond:"#2AA7A0"};
function shapeSVG(kind){
  const fill = SHAPE_COLORS[kind];
  const inner = {
    circle:   '<circle cx="50" cy="50" r="40"/>',
    square:   '<rect x="14" y="14" width="72" height="72" rx="8"/>',
    triangle: '<polygon points="50,12 90,84 10,84" stroke-linejoin="round"/>',
    rectangle:'<rect x="6" y="28" width="88" height="44" rx="8"/>',
    star:     '<polygon points="50,6 61,36 93,36 67,56 76,88 50,69 24,88 33,56 7,36 39,36" stroke-linejoin="round"/>',
    heart:    '<path d="M50 88 C20 64 8 46 8 32 C8 18 19 10 30 10 C39 10 46 15 50 23 C54 15 61 10 70 10 C81 10 92 18 92 32 C92 46 80 64 50 88 Z"/>',
    oval:     '<ellipse cx="50" cy="50" rx="43" ry="30"/>',

/* ------------------------- speech ------------------------- */
let chosenVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  const prefs = ["Samantha","Ava","Allison","Susan","Karen","Moira","Google US English"];
  for (const name of prefs){
    const v = voices.find(v => v.name.startsWith(name) && v.lang.startsWith("en"));
    if (v){ chosenVoice = v; return; }
  }
  chosenVoice = voices.find(v => v.lang === "en-US") || voices.find(v => v.lang.startsWith("en")) || voices[0];
}
if ("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let currentClip = null;
let speakGen = 0; // canceling speech still fires onend; the token keeps stale callbacks quiet
function stopSpeaking(){
  speakGen++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (currentClip){ currentClip.pause(); currentClip = null; }
}

/* speak(key, text, done) — plays audio/<key>.mp3 if registered in
   CUSTOM_AUDIO, otherwise speaks `text` with the device voice.
   Calls done() when finished (or immediately if speech is unavailable). */
function speak(key, text, done){
  stopSpeaking();
  const myGen = speakGen;
  const finish = () => { if (speakGen === myGen && done) done(); };
  if (CUSTOM_AUDIO.has(key)){
    const clip = new Audio(AUDIO_BASE + key + ".mp3");
    currentClip = clip;
    clip.onended = finish;
    clip.onerror = finish;
    clip.play().catch(finish);
    return;
  }
  if (!("speechSynthesis" in window)){ finish(); return; }
  const u = new SpeechSynthesisUtterance(text);
  if (chosenVoice) u.voice = chosenVoice;
  u.rate = 0.9;
  u.pitch = 1.2;
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
}

/* iOS unlocks speech after the first user tap */
let primed = false;
document.addEventListener("pointerdown", () => {
  if (primed || !("speechSynthesis" in window)) return;
  primed = true;
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  speechSynthesis.speak(u);
}, {once:false, capture:true});

/* ------------------------- state ------------------------- */
const $ = id => document.getElementById(id);
const state = {
  module: null,   // key into MODULES
  mode: "teach",  // "teach" | "quiz"
  order: [],      // array of indices into items
  pos: 0,         // position within order
  mixed: true     // quiz order shuffled?
};
let advanceTimer = null;
let safetyTimer = null;

function clearTimers(){
  clearTimeout(advanceTimer); advanceTimer = null;
  clearTimeout(safetyTimer);  safetyTimer  = null;
}

function shuffled(n){
  const a = Array.from({length:n}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentItem(){
  return MODULES[state.module].items[state.order[state.pos]];
}

/* ------------------------- rendering ------------------------- */
function renderCard(){
  const card = $("card");
  const item = currentItem();
  card.style.background = "";
  card.style.color = "";

  if (state.module === "numbers"){
    const rows = item.n === 0
      ? '<div class="none-word">none!</div>'
      : '<div class="animal-rows">' + buildAnimalRows(item) + "</div>";
    card.innerHTML = '<div class="big-number">' + item.n + "</div>" + rows;
  }
  else if (state.module === "letters"){
    const chips = item.sounds.map(x =>
      '<span class="sound-chip' + (x.t ? " " + x.t : "") + '">' + x.s + "</span>").join("");
    const hasVowel = item.sounds.some(x => x.t);
    const legend = hasVowel
      ? '<div class="sound-legend"><span class="leg short">short</span><span class="leg long">long</span></div>'
      : "";
    card.innerHTML = '<div class="big-letters">' + item.upper + " " + item.lower + "</div>"
      + '<div class="sound-chips">' + chips + "</div>" + legend;
  }
  else if (state.module === "colors"){
    card.style.background = item.hex;
    card.style.color = item.ink;
    card.innerHTML = '<div class="color-emoji">' + item.emoji + "</div>"
      + '<div class="color-name">' + item.name + "</div>";
  }
  else if (state.module === "shapes"){
    card.innerHTML = shapeSVG(item.kind) + '<div class="shape-name">' + item.name + "</div>";
  }
  else if (state.module === "animals"){
    card.innerHTML = '<div class="animal-big">' + item.emoji + '</div><div class="shape-name">' + item.name + "</div>";
  }

  card.classList.remove("pop");
  void card.offsetWidth; /* restart animation */
  card.classList.add("pop");
}

function buildAnimalRows(item){
  const per = item.n <= 5 ? item.n : Math.ceil(item.n / 2);
  let left = item.n, html = "";
  while (left > 0){
    const take = Math.min(per, left);
    let row = "";
    for (let i = 0; i < take; i++) row += "<span>" + item.animal.emoji + "</span>";
    html += '<div class="animal-row">' + row + "</div>";
    left -= take;
  }
  return html;
}

/* ------------------------- teach loop ------------------------- */
const TEACH_PAUSE = 1800;   // quiet time after the line, before advancing
const TEACH_SAFETY = 12000; // advance anyway if speech never reports back

function teachCurrent(){
  clearTimers();
  recapActive = false;
  recapGen++;
  renderCard();
  const item = currentItem();
  speak(item.id + "-teach", item.teach, () => {
    if (state.mode !== "teach") return;
    advanceTimer = setTimeout(teachNext, TEACH_PAUSE);
  });
  safetyTimer = setTimeout(() => {
    if (state.mode === "teach") teachNext();
  }, TEACH_SAFETY);
}

function teachNext(){
  clearTimers();
  const atEnd = state.pos === state.order.length - 1;
  state.pos = (state.pos + 1) % state.order.length; // loops forever
  if (atEnd){
    recapModule(); // show everything, announce each item, then start over
    return;
  }
  teachCurrent();
}

/* At the end of every teach loop: show all items in a grid, light each
   one up as it is announced, then loop back to the start. Custom audio:
   uses the module's recap intro key plus each item's short "<id>" clip. */
let recapGen = 0;
let recapActive = false;

function recapCell(item, i){
  const id = ' id="cell-' + i + '"';
  if (state.module === "numbers")
    return '<span class="count-cell"' + id + ">" + item.n + "</span>";
  if (state.module === "letters")
    return '<span class="count-cell cell-sm"' + id + ">" + item.upper + "</span>";
  if (state.module === "colors")
    return '<span class="count-cell cell-color"' + id
      + ' style="background:' + item.hex + ';border-color:rgba(0,0,0,.18)"></span>';
  if (state.module === "shapes")
    return '<span class="count-cell cell-shape"' + id + ">" + shapeSVG(item.kind) + "</span>";
  if (state.module === "animals")
    return '<span class="count-cell cell-sm"' + id + ">" + item.emoji + "</span>";
  return "";
}

function recapModule(){
  clearTimers();
  stopSpeaking();
  recapActive = true;
  const token = ++recapGen;
  const mod = MODULES[state.module];
  const items = mod.items;
  const last = items.length - 1;
  const card = $("card");
  card.style.background = "";
  card.style.color = "";
  card.innerHTML = '<div class="count-title">' + mod.recapIntro.text + "</div>"
    + '<div class="count-grid">' + items.map(recapCell).join("") + "</div>";
  card.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add("pop");

  const alive = () => token === recapGen && state.mode === "teach";
  const step = (i) => {
    if (!alive()) return;
    const prev = $("cell-" + (i - 1));
    if (prev) prev.classList.remove("now");
    if (i > last){
      recapActive = false;
      advanceTimer = setTimeout(() => { if (alive()) teachCurrent(); }, TEACH_PAUSE);
      return;
    }
    const cell = $("cell-" + i);
    cell.classList.add("lit", "now");
    speak(items[i].id, items[i].say, () => {
      clearTimeout(safetyTimer);
      advanceTimer = setTimeout(() => step(i + 1), 280);
    });
    safetyTimer = setTimeout(() => { if (alive()) step(i + 1); }, 6000);
  };
  speak(mod.recapIntro.key, mod.recapIntro.text, () => {
    clearTimeout(safetyTimer);
    advanceTimer = setTimeout(() => step(0), 450);
  });
  safetyTimer = setTimeout(() => { if (alive()) step(0); }, 6000);
}

/* ------------------------- quiz ------------------------- */
function quizShow(){
  clearTimers();
  stopSpeaking();
  renderCard();
}
function quizMove(step){
  const len = state.order.length;
  state.pos = (state.pos + step + len) % len;
  quizShow();
}

/* ------------------------- name module ------------------------- */
/* Says the name, spells it letter by letter with highlights, says it
   again, pauses, then repeats. Letters reuse the "letter-x" clips. */
function nameSequence(){
  clearTimers();
  stopSpeaking();
  const token = ++recapGen;
  const chars = NAME_TEXT.split("");
  const last = chars.length - 1;
  const card = $("card");
  card.style.background = "";
  card.style.color = "";
  card.innerHTML = '<div class="name-word">' + NAME_TEXT + "</div>"
    + '<div class="name-tiles">'
    + chars.map((ch, i) => '<span class="name-tile" id="cell-' + i + '">' + ch + "</span>").join("")
    + "</div>";
  card.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add("pop");

  const alive = () => token === recapGen && state.module === "catherine";
  const sayName = (done) => speak(NAME_KEY, NAME_TEXT + "!", done);
  const step = (i) => {
    if (!alive()) return;
    const prev = $("cell-" + (i - 1));
    if (prev) prev.classList.remove("now");
    if (i > last){
      sayName(() => {
        advanceTimer = setTimeout(() => { if (alive()) nameSequence(); }, 2400);
      });
      return;
    }
    const cell = $("cell-" + i);
    cell.classList.add("lit", "now");
    const upper = chars[i].toUpperCase();
    speak("letter-" + chars[i].toLowerCase(), upper + "!", () => {
      clearTimeout(safetyTimer);
      advanceTimer = setTimeout(() => step(i + 1), 300);
    });
    safetyTimer = setTimeout(() => { if (alive()) step(i + 1); }, 6000);
  };
  sayName(() => {
    clearTimeout(safetyTimer);
    advanceTimer = setTimeout(() => step(0), 500);
  });
  safetyTimer = setTimeout(() => { if (alive()) step(0); }, 6000);
}

/* ------------------------- memory game ------------------------- */
const mem = {pairs:3, layout:[], prevIds:[], flipped:[], matchedCount:0, lock:false,
             interval:null, startAt:0, running:false};

function memFormat(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function memStopClock(){
  clearInterval(mem.interval);
  mem.interval = null;
  mem.running = false;
}
function memStartClock(){
  memStopClock();
  mem.startAt = Date.now();
  mem.running = true;
  $("memTimer").textContent = "0:00";
  mem.interval = setInterval(() => {
    $("memTimer").textContent = memFormat(Date.now() - mem.startAt);
  }, 500);
}

function newMemoryRound(){
  clearTimers();
  stopSpeaking();
  recapGen++;
  mem.flipped = [];
  mem.matchedCount = 0;
  mem.lock = false;

  /* pick this round's animals */
  const pool = shuffled(MEMORY_POOL.length).slice(0, mem.pairs).map(i => MEMORY_POOL[i]);
  let deck;
  /* reshuffle until no card face lands where the same face was last round */
  let tries = 0;
  do {
    deck = shuffled(mem.pairs * 2).map(i => pool[i % mem.pairs]);
    tries++;
  } while (
    tries < 200 &&
    mem.prevIds.length === deck.length &&
    deck.some((it, pos) => it.id === mem.prevIds[pos])
  );
  mem.layout = deck;
  mem.prevIds = deck.map(it => it.id);

  const card = $("card");
  card.style.background = "";
  card.style.color = "";
  card.innerHTML = '<div class="mem-grid p' + mem.pairs + '">'
    + deck.map((it, i) =>
        '<button class="mem-card" data-idx="' + i + '" aria-label="card">'
        + '<span class="back">\u2B50</span>'
        + '<span class="face">' + it.emoji + "</span>"
        + "</button>").join("")
    + "</div>";
  card.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add("pop");
  memStartClock();
}

function flipMemCard(el){
  if (mem.lock) return;
  if (el.classList.contains("up") || el.classList.contains("matched")) return;
  const idx = Number(el.dataset.idx);
  const item = mem.layout[idx];
  el.classList.add("up");
  speak(item.id, item.say, null);
  mem.flipped.push(idx);
  if (mem.flipped.length < 2) return;

  const [a, b] = mem.flipped;
  mem.flipped = [];
  const elA = document.querySelector('.mem-card[data-idx="' + a + '"]');
  const elB = document.querySelector('.mem-card[data-idx="' + b + '"]');
  if (mem.layout[a].id === mem.layout[b].id){
    elA.classList.add("matched");
    elB.classList.add("matched");
    mem.matchedCount++;
    if (mem.matchedCount === mem.pairs) memWin();
  } else {
    mem.lock = true;
    setTimeout(() => {
      elA.classList.remove("up");
      elB.classList.remove("up");
      mem.lock = false;
    }, 1000);
  }
}

function memWin(){
  memStopClock();
  const time = memFormat(Date.now() - mem.startAt);
  const overlay = document.createElement("div");
  overlay.id = "memWin";
  overlay.innerHTML = '<div class="win-title">You did it!</div>'
    + '<div class="win-time">' + time + "</div>"
    + '<button id="memAgain">Play again</button>';
  $("card").appendChild(overlay);
  $("memAgain").addEventListener("click", newMemoryRound);
  speak("memory-win", "You did it! Hooray!", null);
}

    + '" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>'
    + '<button class="anthem-back" id="anthemBack">Back to flags</button>';
}

/* ------------------------- mode + navigation ------------------------- */
function setMode(mode){
  state.mode = mode;
  $("teachBtn").classList.toggle("on", mode === "teach");
  $("quizBtn").classList.toggle("on", mode === "quiz");
  $("teachbar").classList.toggle("hidden", mode !== "teach");
  $("quizbar").classList.toggle("hidden", mode !== "quiz");
  clearTimers();
  stopSpeaking();
  const n = MODULES[state.module].items.length;
  if (mode === "teach"){
    state.order = Array.from({length:n}, (_, i) => i);
    state.pos = 0;
    teachCurrent();
  } else {
    state.order = state.mixed ? shuffled(n) : Array.from({length:n}, (_, i) => i);
    state.pos = 0;
    quizShow();
  }
}

function openModule(key){
  state.module = key;
  const mod = MODULES[key];
  $("moduleName").textContent = mod.label;
  $("home").classList.add("hidden");
  $("module").classList.remove("hidden");
  $("modeToggle").classList.toggle("hidden", mod.type !== "learn");
  $("memoryHud").classList.toggle("hidden", mod.type !== "memory");
  if (mod.type === "learn"){
    setMode("teach");
  } else if (mod.type === "name"){
    state.mode = "teach";
    $("teachbar").classList.remove("hidden");
    $("quizbar").classList.add("hidden");
    nameSequence();
  } else if (mod.type === "memory"){
    state.mode = "game";
    $("teachbar").classList.add("hidden");
    $("quizbar").classList.add("hidden");
    newMemoryRound();
  } else if (mod.type === "anthems"){
    state.mode = "anthems";
    $("teachbar").classList.add("hidden");
    $("quizbar").classList.add("hidden");
    renderAnthemChoice();
  }
}

function goHome(){
  clearTimers();
  stopSpeaking();
  memStopClock();
  recapGen++;
  recapActive = false;
  $("module").classList.add("hidden");
  $("home").classList.remove("hidden");
}

/* ------------------------- wiring ------------------------- */
document.querySelectorAll(".tile").forEach(t =>
  t.addEventListener("click", () => openModule(t.dataset.module)));
$("homeBtn").addEventListener("click", goHome);
$("teachBtn").addEventListener("click", () => setMode("teach"));
$("quizBtn").addEventListener("click", () => setMode("quiz"));
$("prevBtn").addEventListener("click", () => quizMove(-1));
$("nextBtn").addEventListener("click", () => quizMove(1));
$("orderBtn").addEventListener("click", () => {
  state.mixed = !state.mixed;
  $("orderBtn").textContent = state.mixed ? "Mixed up" : "In order";
  setMode("quiz");
});

/* Tap the card: Teach replays the line (and restarts the clock),
   Quiz says the answer, the name module restarts its sequence, and
   the memory game flips cards. */
$("card").addEventListener("click", (e) => {
  const type = MODULES[state.module] ? MODULES[state.module].type : null;
  if (type === "anthems"){
    const flag = e.target.closest("[data-anthem]");
    if (flag){ playAnthem(flag.dataset.anthem); return; }
    if (e.target.closest("#anthemBack")) renderAnthemChoice();
    return;
  }
  if (type === "memory"){
    const el = e.target.closest(".mem-card");
    if (el) flipMemCard(el);
    return;
  }
  if (type === "name"){
    nameSequence();
    return;
  }
  const item = currentItem();
  if (!item) return;
  if (state.mode === "teach"){
    if (recapActive) recapModule();
    else teachCurrent();
  } else {
    speak(item.id, item.say, null);
  }
});
$("memRestart").addEventListener("click", newMemoryRound);
document.querySelectorAll("#pairPicker button").forEach(b =>
  b.addEventListener("click", () => {
    mem.pairs = Number(b.dataset.pairs);
    mem.prevIds = []; /* board size changed; position rule resets */
    document.querySelectorAll("#pairPicker button").forEach(x =>
      x.classList.toggle("on", x === b));
    newMemoryRound();
  }));

/* ------------------------- service worker ------------------------- */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
